[workspace]
members = ["apps", "crates/core", "crates/git", "crates/storage", "crates/sync", "crates/search", "crates/test-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hickory-resolver = "=0.26.2"
libc = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "=0.17.14"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["serde"] }
