[package]
name = "gh-docs-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
gh-docs-core = { path = "../crates/core" }
gh-docs-git = { path = "../crates/git" }
gh-docs-search = { path = "../crates/search" }
gh-docs-storage = { path = "../crates/storage" }
gh-docs-sync = { path = "../crates/sync" }
gh-docs-test-support = { path = "../crates/test-support", optional = true }
rmcp.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
phase1-fixtures = ["dep:gh-docs-test-support"]
phase2-fixtures = ["gh-docs-sync/fixtures"]
phase4-fixtures = ["gh-docs-search/fixtures"]

[[bin]]
name = "gh-docs-phase1-fixture"
required-features = ["phase1-fixtures"]

[[bin]]
name = "gh-docs-phase2-fixture"
required-features = ["phase2-fixtures"]

[[bin]]
name = "gh-docs-phase3-fixture"
required-features = ["phase2-fixtures"]

[[bin]]
name = "gh-docs-phase4-fixture"
required-features = ["phase4-fixtures"]
