[package]
name = "docs-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
httparse.workspace = true
serde.workspace = true
sha2.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
docs-mcp-core = { path = "../crates/core" }
docs-mcp-git = { path = "../crates/git" }
docs-mcp-search = { path = "../crates/search" }
docs-mcp-storage = { path = "../crates/storage" }
docs-mcp-sync = { path = "../crates/sync" }
docs-mcp-test-support = { path = "../crates/test-support", optional = true }
rmcp.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
phase1-fixtures = ["dep:docs-mcp-test-support"]
phase2-fixtures = ["docs-mcp-sync/fixtures"]
phase4-fixtures = ["docs-mcp-search/fixtures"]
phase6-fixtures = ["docs-mcp-sync/fixtures"]

[[bin]]
name = "docs-mcp-phase1-fixture"
required-features = ["phase1-fixtures"]

[[bin]]
name = "docs-mcp-phase2-fixture"
required-features = ["phase2-fixtures"]

[[bin]]
name = "docs-mcp-phase3-fixture"
required-features = ["phase2-fixtures"]

[[bin]]
name = "docs-mcp-phase4-fixture"
required-features = ["phase4-fixtures"]
